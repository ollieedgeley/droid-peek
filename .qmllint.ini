[General]
MaxWarnings=0

[Warnings]
; qmlsc compiler diagnostics are disabled for the ordinary pass because
; Omarchy/Quickshell metadata and dynamically typed JavaScript function
; boundaries are not complete. lint-qml.sh enables them for declarative files.
CompilerWarnings=disable
BadSignalHandlerParameters=warning
Deprecated=warning
DuplicatePropertyBinding=warning
ImportFailure=warning
MissingProperty=warning
MissingType=warning
UnqualifiedAccess=warning
UnresolvedAlias=warning
UnresolvedType=warning
UnusedImports=warning
